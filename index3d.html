<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b2f6b">
<title>Зат алмасу · 3D Ұшақ шабуылы</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b2f6b;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:#0f172a;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#gl{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#vig{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%,rgba(0,0,0,0) 52%,rgba(4,18,48,.42) 100%)}
:root{--accent:#4f6ef7;--accent2:#9b5cf6;--good:#16b981;--bad:#ef4444}
.lbl{font-size:9.5px;font-weight:900;letter-spacing:1.1px;color:#7b879d;text-transform:uppercase}
.big{font-size:22px;font-weight:900;line-height:1;letter-spacing:-.3px}
.card{background:rgba(255,255,255,.94);border-radius:20px;
  box-shadow:0 18px 40px -18px rgba(6,20,52,.55),inset 0 0 0 1px rgba(255,255,255,.7);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(10px + env(safe-area-inset-top)) 10px 0}
#hud.hide{display:none}
.toprow{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.pod{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:18px}
#hLives{display:flex;gap:4px}
#hLives .h{width:19px;height:19px}
#hLives .h.off{opacity:.2;filter:grayscale(1)}
#hLives.break .h:not(.off){animation:brk .6s ease}
@keyframes brk{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,1px) rotate(-7deg)}
  50%{transform:translate(2px,-1px) rotate(7deg)}75%{transform:translate(-1px,1px)}}
.stat{min-width:54px;flex-direction:column;align-items:center;gap:3px}
#hScore.bump .big{animation:bump .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{50%{transform:scale(1.3);color:var(--accent)}}
#hStreak{position:absolute;left:10px;top:calc(62px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:16px;font-weight:900;font-size:14px}
#hStreak.hot{color:#b45309;box-shadow:0 0 0 2px rgba(245,158,11,.6),0 14px 26px -10px rgba(245,158,11,.6)}

/* bottom bar */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 12px calc(14px + env(safe-area-inset-bottom));
  display:flex;gap:9px;justify-content:center}
#bar.hide{display:none}
#bar button{position:relative;flex:1 1 0;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;
  border:0;border-radius:17px;padding:9px 4px 7px;font:inherit;font-weight:900;font-size:10.5px;letter-spacing:.3px;
  color:#33415f;background:rgba(255,255,255,.94);box-shadow:0 14px 28px -12px rgba(6,20,52,.55),inset 0 0 0 1px rgba(255,255,255,.7);
  cursor:pointer;transition:transform .12s,opacity .2s}
#bar button:active{transform:scale(.93)}
#bar button[disabled]{opacity:.4}
#bar button .n{position:absolute;top:-4px;right:8px;background:var(--accent);color:#fff;font-size:9px;
  border-radius:9px;padding:1px 5px;font-weight:900}
#bar button svg{width:22px;height:22px}

/* screens */
#scr{position:fixed;inset:0;display:none;place-items:center;padding:16px;z-index:9;
  background:linear-gradient(180deg,rgba(6,22,58,.6),rgba(6,22,58,.35))}
#scr.show{display:grid}
.panel{width:min(420px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:20px 18px 18px;
  border-radius:26px;text-align:center;animation:popIn .36s cubic-bezier(.2,1.4,.35,1) both}
@keyframes popIn{from{opacity:0;translate:0 16px;scale:.94}to{opacity:1;translate:0 0;scale:1}}
h1{margin:2px 0 5px;font-size:24px;font-weight:900;letter-spacing:-.6px;line-height:1.08}
h1 span{background:linear-gradient(92deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0 0 14px;font-size:12.5px;font-weight:700;color:#6b7691;line-height:1.45}
.field{display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:16px;background:#fff;
  box-shadow:inset 0 0 0 2px rgba(79,110,247,.22);margin-bottom:12px}
.field input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-weight:800;font-size:15px;color:#0f172a;background:none}
.seg{display:flex;gap:5px;padding:5px;border-radius:16px;background:rgba(16,20,24,.055);margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-weight:900;font-size:11px;color:#6b7691;
  padding:9px 3px;border-radius:12px;cursor:pointer;transition:.18s}
.seg button.on{background:#fff;color:#243b6b;box-shadow:0 8px 18px -8px rgba(6,20,52,.5)}
.cta{width:100%;border:0;border-radius:18px;padding:15px 12px;font:inherit;font-weight:900;font-size:16.5px;color:#fff;
  letter-spacing:.3px;cursor:pointer;background:linear-gradient(96deg,var(--accent),var(--accent2));
  box-shadow:0 18px 34px -14px rgba(79,110,247,.85);transition:transform .12s}
.cta:active{transform:scale(.97)}
.ghost{width:100%;border:0;border-radius:16px;padding:11px;margin-top:9px;font:inherit;font-weight:900;font-size:13px;
  color:#3d4c6b;background:rgba(79,110,247,.1);cursor:pointer}
.rows{display:flex;gap:8px;margin-bottom:13px}
.rows .card{flex:1;padding:10px 6px;border-radius:16px}
.rows .big{font-size:19px}
.note{font-size:11px;font-weight:700;color:#8b95ab;margin-top:11px;line-height:1.5}
.tag{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;
  background:rgba(79,110,247,.11);color:#33488f;font-size:10.5px;font-weight:900;letter-spacing:.4px;margin-bottom:10px}

/* question sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;display:none;padding:0 10px calc(86px + env(safe-area-inset-bottom));z-index:6}
#sheet.show{display:block}
.qcard{border-radius:24px;overflow:hidden;animation:slideUp .32s cubic-bezier(.2,1.1,.3,1) both;
  box-shadow:0 -18px 52px -14px rgba(6,20,52,.72),0 0 0 1px rgba(255,255,255,.5)}
@keyframes slideUp{from{opacity:0;translate:0 40px}to{opacity:1;translate:0 0}}
.qhead{display:flex;align-items:center;gap:10px;padding:12px 13px;background:linear-gradient(100deg,#3f5ce0,#8b4fe8)}
.qhead .badge{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:0 0 auto}
.qhead .badge svg{width:32px;height:32px}
.qhead .who{flex:1;min-width:0;text-align:left}
.qhead .who b{display:block;font-size:9px;font-weight:900;letter-spacing:1.3px;color:rgba(255,255,255,.72)}
.qhead .who span{display:block;font-size:12.5px;font-weight:900;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:rgba(255,255,255,.16);border-radius:10px;padding:3px 9px;margin-top:3px}
#ring{width:46px;height:46px;flex:0 0 auto;position:relative}
#ring svg{transform:rotate(-90deg);width:46px;height:46px}
#ring circle{fill:none;stroke-width:5;stroke-linecap:round}
#ring .bg{stroke:rgba(255,255,255,.26)}
#ring .fg{stroke:#fff;transition:stroke .3s}
#ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:900;color:#fff}
#ring.low .fg{stroke:#ffd166}
#ring.low b{animation:tick .5s infinite;color:#ffd166}
@keyframes tick{50%{transform:scale(1.18)}}
.qbody{background:rgba(255,255,255,.97);padding:14px 13px 13px}
#qText{font-size:17px;font-weight:900;line-height:1.28;letter-spacing:-.2px;margin:0 0 10px}
#qMeta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
#qMeta .mpill{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:99px;font-size:10.5px;
  font-weight:900;background:rgba(79,110,247,.1);color:#33488f}
#qMeta .mpill.own{background:rgba(155,92,246,.13);color:#6b34b8}
#opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;border:0;border-radius:16px;padding:12px;text-align:left;font:inherit;
  font-weight:800;font-size:14.5px;line-height:1.25;color:#1e2740;background:#f6f8fc;cursor:pointer;
  box-shadow:inset 0 0 0 1.5px rgba(16,20,24,.06);transition:transform .12s,background .2s,box-shadow .2s}
.opt:active{transform:scale(.985)}
.opt .k{width:26px;height:26px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;
  font-size:12.5px;font-weight:900;background:rgba(79,110,247,.13);color:var(--accent)}
.opt.right{background:rgba(22,185,129,.15);box-shadow:inset 0 0 0 2px var(--good)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{background:rgba(239,68,68,.13);box-shadow:inset 0 0 0 2px var(--bad)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.3}
.qfoot{text-align:center;font-size:9.5px;font-weight:900;letter-spacing:1px;color:#9aa5bb;padding:9px 0 2px}

/* fx overlays */
#verdict{position:fixed;left:50%;top:calc(72px + env(safe-area-inset-top));translate:-50% 0;z-index:8;
  padding:11px 20px;border-radius:99px;font-weight:900;font-size:17px;color:#fff;background:#0b1017;
  box-shadow:0 20px 40px -14px rgba(0,0,0,.7);opacity:0;pointer-events:none}
#verdict.show{animation:vIn .8s cubic-bezier(.2,1.4,.35,1) forwards}
@keyframes vIn{0%{opacity:0;scale:.7}16%{opacity:1;scale:1}76%{opacity:1;scale:1}100%{opacity:0;scale:.94}}
#verdict.ok{background:linear-gradient(96deg,#0f9e6e,#16b981)}
#verdict.bad{background:linear-gradient(96deg,#c92a2a,#ef4444)}
#banner{position:fixed;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;z-index:7;opacity:0}
#banner.show{animation:bIn 1.8s ease forwards}
@keyframes bIn{0%{opacity:0;scale:.7}12%{opacity:1;scale:1}74%{opacity:1;scale:1}100%{opacity:0;scale:1.12}}
#banner small{display:block;font-size:11px;font-weight:900;letter-spacing:5px;color:rgba(255,255,255,.86);
  text-shadow:0 3px 12px rgba(0,20,60,.6)}
#banner b{display:block;font-size:min(15vw,58px);font-weight:900;letter-spacing:-1.5px;color:#fff;line-height:1;
  margin:5px 0;text-shadow:0 8px 26px rgba(0,20,60,.55)}
#banner i{display:block;font-style:normal;font-size:13px;font-weight:900;color:#ffe08a;text-shadow:0 3px 12px rgba(0,0,0,.5)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
#flash.go{animation:fl .3s ease-out}
@keyframes fl{0%{opacity:.7}100%{opacity:0}}
#hit{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;box-shadow:inset 0 0 90px 26px rgba(239,68,68,.72)}
#hit.go{animation:hitA .55s ease-out}
@keyframes hitA{0%{opacity:1}100%{opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));translate:-50% 0;z-index:9;
  padding:9px 15px;border-radius:14px;background:rgba(11,16,23,.9);color:#fff;font-size:12px;font-weight:900;
  opacity:0;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{animation:tIn 2.2s ease forwards}
@keyframes tIn{0%{opacity:0;translate:-50% 10px}12%,80%{opacity:1;translate:-50% 0}100%{opacity:0;translate:-50% 6px}}

/* editor */
.ed{display:flex;flex-direction:column;gap:8px;text-align:left}
.ed label{font-size:10px;font-weight:900;letter-spacing:.8px;color:#7b879d;text-transform:uppercase;margin-top:4px}
.ed input{width:100%;border:0;border-radius:13px;padding:11px 12px;font:inherit;font-weight:800;font-size:14px;
  background:#f6f8fc;box-shadow:inset 0 0 0 1.5px rgba(16,20,24,.07);outline:0;color:#1e2740}
.ed input:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.ed .opt{padding:9px 11px;font-size:13.5px}
.ed .opt.pick{background:rgba(22,185,129,.14);box-shadow:inset 0 0 0 2px var(--good)}
.ed .opt.pick .k{background:var(--good);color:#fff}
.list{max-height:42dvh;overflow:auto;display:flex;flex-direction:column;gap:7px;margin-bottom:10px;text-align:left}
.list .it{padding:10px 12px;border-radius:14px;background:#f6f8fc;box-shadow:inset 0 0 0 1.5px rgba(16,20,24,.06)}
.list .it b{display:block;font-size:13px;font-weight:900;color:#1e2740;line-height:1.3}
.list .it span{display:block;font-size:11px;font-weight:700;color:#7b879d;margin-top:2px}
.list .it{position:relative;padding-right:40px}
.list .it .del{position:absolute;right:8px;top:50%;translate:0 -50%;width:27px;height:27px;border:0;border-radius:10px;
  background:rgba(239,68,68,.12);color:#b4232b;font:inherit;font-weight:900;font-size:15px;line-height:1;cursor:pointer}
.orow{display:flex;align-items:center;gap:7px}
.orow .tick{width:36px;height:38px;flex:0 0 auto;border:0;border-radius:12px;background:#eef2fa;color:#98a2b8;
  font:inherit;font-weight:900;font-size:12px;cursor:pointer;box-shadow:inset 0 0 0 1.5px rgba(16,20,24,.07);transition:.16s}
.orow .tick.on{background:var(--good);color:#fff;box-shadow:0 10px 20px -10px rgba(22,185,129,.85)}
.orow .tick svg{width:17px;height:17px;display:block;margin:auto}
.orow .inp{flex:1;min-width:0}

/* floating 3D labels */
#labels{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.plab{position:absolute;left:0;top:0;transform-origin:50% 100%;white-space:nowrap;display:none;
  align-items:center;gap:6px;padding:5px 11px;border-radius:99px;
  background:rgba(9,22,48,.66);box-shadow:0 12px 24px -14px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.18);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);transition:opacity .3s,background .25s;will-change:transform,opacity}
.plab.show{display:flex}
.plab span{font-size:11px;font-weight:900;letter-spacing:.3px;color:#fff}
.plab b{display:none;font-size:9px;font-weight:900;letter-spacing:1px;color:#ffd166}
.plab.boss b{display:block}
.plab.boss{background:rgba(96,54,7,.75);box-shadow:0 12px 26px -12px rgba(0,0,0,.8),inset 0 0 0 1.4px rgba(255,209,102,.75)}
.plab.near{background:rgba(79,110,247,.86)}
.plab.near.boss{background:rgba(180,83,9,.88)}

#nogl{position:fixed;inset:0;display:none;place-items:center;padding:18px;z-index:20;background:#0b2f6b}
#nogl.show{display:grid}
#spin{position:fixed;left:50%;top:50%;translate:-50% -50%;z-index:15;text-align:center;color:#fff}
#spin i{display:block;width:38px;height:38px;margin:0 auto 10px;border-radius:50%;
  border:4px solid rgba(255,255,255,.28);border-top-color:#fff;animation:sp .8s linear infinite;font-style:normal}
@keyframes sp{to{rotate:360deg}}
#spin b{font-size:11px;font-weight:900;letter-spacing:1.6px;opacity:.85}
#spin.gone{display:none}
</style>
</head>
<body>
<div id="gl"><canvas id="cv"></canvas></div>
<div id="vig"></div>

<div id="hud" class="hide">
  <div class="toprow">
    <div class="card pod" id="hLives"></div>
    <div style="display:flex;gap:8px">
      <div class="card pod stat" id="hScore"><div class="lbl">Ұпай</div><div class="big">0</div></div>
      <div class="card pod stat" id="hWave"><div class="lbl">Толқын</div><div class="big">1</div></div>
    </div>
  </div>
  <div class="card pod" id="hStreak" style="display:none"></div>
</div>

<div id="bar" class="hide">
  <button data-p="fifty"><span class="n">2</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 7h6v10H4zM14 7h6v10h-6z"/><path d="M7 10v4M17 10v4" stroke-linecap="round"/></svg>50/50</button>
  <button data-p="shield"><span class="n">1</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z" stroke-linejoin="round"/><path d="M8.5 12l2.5 3 4.5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>Қалқан</button>
  <button data-p="edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 20l4-1 11-11-3-3L5 16z" stroke-linejoin="round"/><path d="M14 5l3 3" stroke-linecap="round"/></svg>Сұрақ</button>
  <button data-p="quit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9" stroke-linecap="round" stroke-linejoin="round"/></svg>Шығу</button>
</div>

<div id="verdict"></div>
<div id="banner"><small id="bnTop"></small><b id="bnBig"></b><i id="bnSub"></i></div>
<div id="flash"></div><div id="hit"></div><div id="toast"></div>

<div id="sheet">
  <div class="qcard">
    <div class="qhead">
      <div class="badge" id="qCraft"></div>
      <div class="who"><b>АСПАНДАҒЫ СРАҚ</b><span id="qCat"></span></div>
      <div id="ring"><svg viewBox="0 0 46 46"><circle class="bg" cx="23" cy="23" r="20"/><circle class="fg" id="ringFg" cx="23" cy="23" r="20" stroke-dasharray="125.66" stroke-dashoffset="0"/></svg><b id="ringNum">12</b></div>
    </div>
    <div class="qbody">
      <p id="qText"></p>
      <div id="qMeta"></div>
      <div id="opts"></div>
      <div class="qfoot">ДҰРЫС ЖАУАП — ҰШАҚ БІРДЕН ЖАРЫЛАДЫ</div>
    </div>
  </div>
</div>

<div id="scr"><div class="panel card" id="panel"></div></div>

<div id="nogl"><div class="panel card">
  <h1>Бұл құрылғыда <span>3D</span> жүктелмеді</h1>
  <p class="sub">WebGL қосылмады. Ойынның толық жұмыс істейтін 2D нұсқасы бар.</p>
  <a class="cta" style="display:block;text-decoration:none;text-align:center" href="./2d/">2D нұсқасына өту →</a>
</div></div>

<div id="spin"><i></i><b>3D ӘЛЕМ ДАЙЫНДАЛУДА</b></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"
  onerror="var s=document.createElement('script');s.src='https://unpkg.com/three@0.150.1/build/three.min.js';s.onerror=function(){window.__fail&&window.__fail()};document.head.appendChild(s);"></script>
<script>
(function(){'use strict';
/* ================= utils ================= */
var $=function(i){return document.getElementById(i)};
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(a,b){return a+Math.random()*(b-a)}
function ri(a,b){return Math.floor(rnd(a,b+1))}
function pick(a){return a[(Math.random()*a.length)|0]}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=(Math.random()*(i+1))|0,t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function hash2(x,y){var n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)}
var T=performance.now();

/* ================= questions ================= */

var AC=null,sfx={on:true};
function ac(){if(!sfx.on)return null;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,d,type,vol,slide){var c=ac();if(!c)return;
  var o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,slide),c.currentTime+d);
  g.gain.value=0;g.gain.linearRampToValueAtTime(vol||.16,c.currentTime+.012);
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d+.02)}
function noise(d,f0,f1,vol){var c=ac();if(!c)return;
  var n=c.sampleRate*d,buf=c.createBuffer(1,n,c.sampleRate),ch=buf.getChannelData(0);
  for(var i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);
  var s=c.createBufferSource();s.buffer=buf;
  var flt=c.createBiquadFilter();flt.type='lowpass';flt.frequency.value=f0;
  flt.frequency.exponentialRampToValueAtTime(Math.max(60,f1),c.currentTime+d);
  var g=c.createGain();g.gain.value=vol||.3;g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);
  s.connect(flt);flt.connect(g);g.connect(c.destination);s.start()}
sfx.click=function(){tone(560,.06,'triangle',.1)};
sfx.correct=function(){tone(660,.09,'triangle',.14);setTimeout(function(){tone(990,.16,'triangle',.14)},80)};
sfx.wrong=function(){tone(220,.2,'sawtooth',.12,110)};
sfx.boom=function(){noise(.55,1400,60,.5);tone(70,.4,'sine',.22,32)};
sfx.whoosh=function(){noise(.3,900,180,.16)};
sfx.power=function(){tone(440,.08,'square',.09);setTimeout(function(){tone(880,.12,'square',.09)},70)};
sfx.win=function(){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){tone(f,.2,'triangle',.13)},i*110)})};
sfx.hurt=function(){tone(150,.24,'square',.14,70)};

function softTex(inner,outer,pw){
  var s=128,cv=document.createElement('canvas');cv.width=cv.height=s;
  var g=cv.getContext('2d'),r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  r.addColorStop(0,inner);r.addColorStop(pw||.42,outer);r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r;g.fillRect(0,0,s,s);
  var t=new THREE.CanvasTexture(cv);t.needsUpdate=true;return t}
function ringTex(){
  var s=128,cv=document.createElement('canvas');cv.width=cv.height=s;var g=cv.getContext('2d');
  g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=3;g.beginPath();g.arc(s/2,s/2,s/2-5,0,6.283);g.stroke();
  g.strokeStyle='rgba(255,255,255,.22)';g.lineWidth=7;g.beginPath();g.arc(s/2,s/2,s/2-9,0,6.283);g.stroke();
  var t=new THREE.CanvasTexture(cv);return t}
function smokeTex(){
  var s=64,cv=document.createElement('canvas');cv.width=cv.height=s;var g=cv.getContext('2d');
  var r=g.createRadialGradient(s/2,s/2,2,s/2,s/2,s/2);
  r.addColorStop(0,'rgba(90,96,110,.9)');r.addColorStop(.5,'rgba(70,76,90,.45)');r.addColorStop(1,'rgba(60,66,80,0)');
  g.fillStyle=r;g.fillRect(0,0,s,s);return new THREE.CanvasTexture(cv)}

var W={planes:[],fx:[],labels:[],shake:0,t:0,par:{x:0,y:0,tx:0,ty:0}};
function initWorld(){
  var cv=$('cv');
  W.r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:false,powerPreference:'high-performance'});
  W.r.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  W.r.setSize(innerWidth,innerHeight,false);
  try{if(THREE.sRGBEncoding)W.r.outputEncoding=THREE.sRGBEncoding}catch(e){}
  W.scene=new THREE.Scene();
  W.scene.fog=new THREE.Fog(0xc5ddf6,520,1750);
  W.cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.5,4200);
  W.camPos=new THREE.Vector3(0,34,150);
  W.camAim=new THREE.Vector3(0,168,-700);

  /* sky dome */
  var sky=new THREE.ShaderMaterial({
    uniforms:{top:{value:new THREE.Color(0x14418f)},mid:{value:new THREE.Color(0x5fa6e2)},bot:{value:new THREE.Color(0xe6f2ff)}},
    vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'uniform vec3 top,mid,bot;varying vec3 vP;void main(){float h=normalize(vP).y;'+
      'vec3 c=mix(mid,top,smoothstep(0.04,0.62,h));c=mix(bot,c,smoothstep(-0.10,0.10,h));gl_FragColor=vec4(c,1.0);}',
    side:THREE.BackSide,depthWrite:false,fog:false});
  W.scene.add(new THREE.Mesh(new THREE.SphereGeometry(2600,24,16),sky));

  /* lights */
  W.sunDir=new THREE.Vector3(-620,760,-1150);
  var sun=new THREE.DirectionalLight(0xfff3d6,1.25);sun.position.copy(W.sunDir);W.scene.add(sun);
  W.scene.add(new THREE.HemisphereLight(0xd8ecff,0x4c6b3c,.9));
  var fill=new THREE.DirectionalLight(0xbfd8ff,.35);fill.position.set(500,220,700);W.scene.add(fill);
  W.flash=new THREE.PointLight(0xffd9a0,0,420,2);W.flash.position.set(0,120,-200);W.scene.add(W.flash);

  /* sun disc + glow */
  TEX.glow=softTex('rgba(255,255,255,1)','rgba(255,236,180,.55)',.2);
  var gs=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX.glow,color:0xffffff,transparent:true,
    blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  gs.position.copy(W.sunDir).multiplyScalar(1.55);gs.scale.set(900,900,1);W.scene.add(gs);
  var disc=new THREE.Mesh(new THREE.CircleGeometry(120,26),new THREE.MeshBasicMaterial({color:0xfff6d0,fog:false}));
  disc.position.copy(W.sunDir).multiplyScalar(1.54);disc.lookAt(0,0,0);W.scene.add(disc);

  /* terrain — terrH() is the single source of truth so props sit on the ground */
  function terrH(x,z){
    var h=Math.sin(x*.0021)*Math.cos(z*.0017)*82+Math.sin(x*.0063+1.7)*Math.cos(z*.0051)*30+Math.sin((x+z)*.013)*7;
    var near=clamp((z+2400)/2600,0,1);
    var flat=clamp(1-Math.abs(x)/1150,0,1);
    return h*(.35+near*.65)*(1-flat*.94)-6;
  }
  W.terrH=terrH;
  var gg=new THREE.PlaneGeometry(5200,5200,86,86);gg.rotateX(-Math.PI/2);
  var p=gg.attributes.position,col=[];
  for(var i=0;i<p.count;i++){
    var x=p.getX(i),z=p.getZ(i);
    var h=terrH(x,z);
    p.setY(i,h);
    var c=new THREE.Color(),cell=hash2(Math.floor(x/150),Math.floor(z/150));
    c.setHSL(.26-cell*.05,.34+cell*.16,.24+clamp((h+90)/250,0,1)*.16+cell*.05);
    col.push(c.r,c.g,c.b);
  }
  gg.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  gg.computeVertexNormals();
  W.scene.add(new THREE.Mesh(gg,new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true})));

  /* roads */
  var roadM=new THREE.MeshLambertMaterial({color:0x53596b});
  for(var k=0;k<3;k++){
    var rd=new THREE.Mesh(new THREE.BoxGeometry(k?22:30,1.8,4600),roadM);
    rd.position.set(k===0?-300:(k===1?300:-40),-5.2,-900);rd.rotation.y=k*.28;W.scene.add(rd);
  }
  /* river */
  var riv=new THREE.Mesh(new THREE.BoxGeometry(120,1.6,4600),
    new THREE.MeshLambertMaterial({color:0x2f7fc4}));
  riv.position.set(760,-5.6,-900);riv.rotation.y=-.16;W.scene.add(riv);

  /* mountains on the horizon */
  var mm=new THREE.MeshLambertMaterial({color:0x6d82a4,flatShading:true}),ms=new THREE.MeshLambertMaterial({color:0xf1f6fb,flatShading:true});
  for(var m=0;m<16;m++){
    var a=-Math.PI*.12-Math.PI*.76*(m/15),dist=rnd(1500,2100),hh=rnd(200,470),rr=rnd(190,380);
    var mx=Math.cos(a)*dist*1.35,mz=Math.sin(a)*dist-500,gy=terrH(mx,mz);
    var cone=new THREE.Mesh(new THREE.ConeGeometry(rr,hh,ri(4,6),1),mm);
    cone.position.set(mx,gy+hh/2-30,mz);
    cone.rotation.y=rnd(0,3);W.scene.add(cone);
    var cap=new THREE.Mesh(new THREE.ConeGeometry(rr*.34,hh*.3,ri(4,6),1),ms);
    cap.position.set(mx,gy+hh*.82-30,mz);cap.rotation.y=cone.rotation.y;W.scene.add(cap);
  }

  /* city */
  var city=new THREE.Group();
  var palette=[0x8e9bb3,0xa8b4c8,0x7b88a4,0xb9c4d6,0x6e7d99];
  for(var b=0;b<46;b++){
    var hgt=rnd(32,176),wd=rnd(16,34),px=rnd(-760,-170),pz=rnd(-1560,-640),H=hgt+34;
    var box=new THREE.Mesh(new THREE.BoxGeometry(wd,H,wd),
      new THREE.MeshLambertMaterial({color:pick(palette),flatShading:true}));
    box.position.set(px,terrH(px,pz)+hgt-6-H/2,pz);
    city.add(box);
    if(hgt>128){var bc=new THREE.Mesh(new THREE.SphereGeometry(3.4,8,8),

  }
  for(var b2=0;b2<26;b2++){
    var h2=rnd(24,112),w2=rnd(14,30),px2=rnd(170,790),pz2=rnd(-1500,-620),H2=h2+34;
    var bx2=new THREE.Mesh(new THREE.BoxGeometry(w2,H2,w2),
      new THREE.MeshLambertMaterial({color:pick(palette),flatShading:true}));
    bx2.position.set(px2,terrH(px2,pz2)+h2-6-H2/2,pz2);city.add(bx2);

function wingGeo(len,cR,cT,th,sweep,dih){
  var g=new THREE.BoxGeometry(len,th,cR,Math.max(8,Math.round(len)),1,1),p=g.attributes.position;
  for(var i=0;i<p.count;i++){
    var x=p.getX(i),y=p.getY(i),z=p.getZ(i),t=clamp(x/len+.5,0,1);
    p.setZ(i,z*(1+(cT/cR-1)*t)-sweep*t);

  g.computeVertexNormals();g.translate(len/2,0,0);return g}

function updatePlanes(dt,t){
  for(var i=W.planes.length-1;i>=0;i--){
    var o=W.planes[i];
    if(o.dead){o.grp.scale.multiplyScalar(1);continue}
    if(!o.frozen){
      o.z+=o.sp*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;
      o.y+=Math.sin(t*1.9+o.ph)*7*dt*2.2;
      if(o.x<-165||o.x>165)o.vx*=-1;
    }
    o.grp.position.set(o.x,o.y,o.z);
    var bank=clamp(-o.vx/o.sp,-.6,.6);
    o.grp.rotation.z=-bank*.85+Math.sin(t*1.3+o.ph)*.05;
    o.grp.rotation.y=clamp(o.vx/o.sp,-.5,.5)*.6;
    o.grp.rotation.x=clamp(o.vy/o.sp,-.4,.4)*.5+Math.sin(t*2.2+o.ph)*.03;
    for(var s=0;s<o.spin.length;s++)o.spin[s].o.rotation[o.spin[s].o.userData.axis||'z']+=o.spin[s].r*dt;
    for(var b=0;b<o.blink.length;b++)o.blink[b].visible=(t*1.6+b*.5)%1>.42;
    for(var u=0;u<o.burn.length;u++){
      var f=.78+Math.abs(Math.sin(t*22+u))*.42;
      o.burn[u].scale.set(f,1+(1-f)*.5,f);o.burn[u].material.opacity=.7+Math.abs(Math.sin(t*17+u))*.3}
    var d=o.grp.position.distanceTo(W.cam.position);
    var near=clamp(1-(d-120)/420,0,1);
    o.lock.material.opacity=near*(.35+Math.sin(t*5)*.16);
    o.lock.scale.setScalar(70+near*46);
    o.tgt=near;
    if(o.z>W.cam.position.z+80||o.y<-30){
      if(!o.frozen){
        if(PG.on&&PG.cur!==o)escapePlane(o);
        else if(!PG.on)removePlane(o);
      }
    }
    placeLabel(o);
  }
}

function updateFX(dt){
  for(var i=W.fx.length-1;i>=0;i--){
    var f=W.fx[i];f.t+=dt;var k=f.t/f.dur;
    if(k>=1){killFX(f);W.fx.splice(i,1);continue}
    var e=1-Math.pow(1-k,2.4);
    for(var b=0;b<f.balls.length;b++){
      var o=f.balls[b],bk=clamp((k-o.d)/.62,0,1);
      var s=o.s0+(1-Math.pow(1-bk,2))*(o.s1-o.s0);
      o.m.scale.set(s,s,1);
      o.m.material.opacity=Math.min(1,(1-bk)*2.3);
      o.m.position.copy(o.off).addScaledVector(o.off,1+bk*.9);
      o.m.material.rotation=k*1.6*(b%2?1:-1)}
    f.core.scale.setScalar(28+e*24);f.core.material.opacity=Math.max(0,1-k*5.5);
    f.wave.scale.setScalar(18+e*152);f.wave.material.opacity=.95*Math.max(0,1-k*3.4);
    for(var p=0;p<f.parts.length;p++){
      var q2=f.parts[p];q2.v.y-=110*dt;q2.m.position.addScaledVector(q2.v,dt);
      q2.m.rotation.x+=q2.w.x*dt;q2.m.rotation.y+=q2.w.y*dt;q2.m.rotation.z+=q2.w.z*dt;
      if(k>.55){q2.m.material.transparent=true;q2.m.material.opacity=Math.max(0,1-(k-.55)/.45)}}
    for(var n=0;n<f.embers.length;n++){
      var m2=f.embers[n];if(k<m2.d)continue;
      var nk=(k-m2.d)/(f.dur-m2.d);
      m2.v.y-=64*dt;m2.m.position.addScaledVector(m2.v,dt);
      m2.m.material.opacity=Math.max(0,1-nk*1.5);m2.m.scale.setScalar((1-nk*.5)*8)}
    for(var s3=0;s3<f.smoke.length;s3++){
      var mm=f.smoke[s3];if(k<mm.d)continue;
      var sk=(k-mm.d)/(f.dur-mm.d);
      mm.m.position.addScaledVector(mm.v,dt);mm.v.y*=.985;
      mm.m.scale.setScalar(12+sk*62);mm.m.material.opacity=.34*Math.max(0,1-sk*1.15)}
    W.flash.intensity*=Math.pow(2e-5,dt);
  }}

var ptr=null,_pv=null;
function initPick(){ptr=new THREE.Vector2();_pv=new THREE.Vector3();
  var cv=$('cv');
  cv.addEventListener('pointerdown',onTap,{passive:true});
  cv.addEventListener('pointermove',function(e){
    W.par.tx=clamp((e.clientX/innerWidth-.5)*2,-1,1);
    W.par.ty=clamp((e.clientY/innerHeight-.5)*2,-1,1)},{passive:true});
  addEventListener('pointerleave',function(){W.par.tx=0;W.par.ty=0},{passive:true})}
function onTap(ev){
  if(!PG.on||PG.cur||PG.locked||PG.paused)return;
  var fov=W.cam.fov*Math.PI/180,best=null,bd=1e9;
  for(var i=0;i<W.planes.length;i++){
    var o=W.planes[i];if(o.dead)continue;
    _pv.copy(o.grp.position).project(W.cam);
    if(_pv.z>1)continue;
    var sx=(_pv.x*.5+.5)*innerWidth,sy=(-_pv.y*.5+.5)*innerHeight;
    var dist=Math.max(60,o.grp.position.distanceTo(W.cam.position));
    var pxPerUnit=innerHeight/(2*dist*Math.tan(fov/2));
    var rad=clamp(o.cr.sc*34*pxPerUnit,56,150);
    var d=Math.sqrt((sx-ev.clientX)*(sx-ev.clientX)+(sy-ev.clientY)*(sy-ev.clientY));
    if(d<=rad&&d<bd){bd=d;best=o}}
  if(best)openPlaneQ(best)}

/* ================= camera ================= */
function updateCam(dt,t){
  if(W.shake>0){W.shake=Math.max(0,W.shake-dt*2.1)}
  var s=W.shake*W.shake,k=Math.min(1,dt*3.4);
  W.par.x+=(W.par.tx-W.par.x)*k;W.par.y+=(W.par.ty-W.par.y)*k;
  var px=W.par.x*44,py=-W.par.y*26;
  W.cam.position.set(W.camPos.x+px+Math.sin(t*47)*s*7,
    W.camPos.y+py+Math.sin(t*39+1)*s*7+Math.sin(t*.6)*2.4,
    W.camPos.z+Math.cos(t*43)*s*5);
  W.camAim.x=Math.sin(t*.12)*22+Math.sin(t*51)*s*10-px*.45;
  W.camAim.y=168-py*.5;
  W.cam.lookAt(W.camAim)}

function updateWorld(dt,t){
  for(var i=0;i<W.clouds.length;i++){
    var c=W.clouds[i],sd=c.userData.side;c.position.z+=c.userData.sp*dt;
    if(c.position.z>(sd?-260:-760)){

      c.position.y=sd?rnd(150,330):rnd(170,440)}}
  var bl=W.beacons||[];
  for(var b=0;b<bl.length;b++)bl[b].visible=(t*1.1+b*.37)%1>.5}

    var cur=myqGet();cur.push({c:$('eC').value.trim()||'Менікі',q:q,o:vals,a:ED.a});
    myqSet(cur);sfx.power();toast('Сұрақ сақталды ('+cur.length+')');renderEdit()});
  $('eBack').addEventListener('click',editBack);
  var list=document.querySelector('.list');
  if(list)list.addEventListener('click',function(e){
    var b=e.target.closest('.del');if(!b)return;
    var cur=myqGet();cur.splice(+b.dataset.del,1);myqSet(cur);sfx.click();renderEdit()})}
function editBack(){
  var was=PG.paused?performance.now()-PG.pauseAt:0;
  PG.paused=false;
  if(PG.on&&!PG.over){
    hide();
    if(PG.cur&&PG.locked===false){PG.t0+=was;$('sheet').classList.add('show')}
  } else screenStart()}
function startGame(){
  if(!nameOf()){store('za_player','Ойыншы');}
  PG.on=true;PG.over=false;PG.decor=false;PG.wave=1;PG.lives=3;PG.livesMax=3;PG.score=0;PG.streak=0;
  PG.maxStreak=0;PG.kills=0;PG.correct=0;PG.total=0;PG.serial=0;PG.cur=null;PG.locked=false;
  PG.fifty=2;PG.shields=1;PG.shield=false;PG.nextAt=performance.now()+700;
  QUEUE=[];
  for(var i=W.planes.length-1;i>=0;i--)removePlane(W.planes[i]);
  hide();$('hud').classList.remove('hide');$('bar').classList.remove('hide');
  hud();banner('АЛҒА','ТОЛҚЫН 1','Ұшақтарды түртіп атыс');sfx.win()}
function gameOver(){
  PG.on=false;PG.over=true;
  for(var i=W.planes.length-1;i>=0;i--)if(!W.planes[i].fleeing)removePlane(W.planes[i]);
  $('sheet').classList.remove('show');$('bar').classList.add('hide');
  var acc=PG.total?Math.round(PG.correct/PG.total*100):0;
  if(PG.score>PG.best){PG.best=PG.score;store('za_best3d',String(PG.best))}
  sfx.win();
  show('<div class="tag">ОЙЫН БІТТІ</div><h1>Ұпай: <span>'+PG.score+'</span></h1>'+
    '<p class="sub">'+esc(nameOf())+' · толқын '+PG.wave+'</p>'+
    '<div class="rows"><div class="card"><div class="lbl">Дұрыс</div><div class="big">'+PG.correct+'/'+PG.total+'</div></div>'+
    '<div class="card"><div class="lbl">Нақтылық</div><div class="big">'+acc+'%</div></div>'+
    '<div class="card"><div class="lbl">Рекорд</div><div class="big">'+PG.best+'</div></div></div>'+
    '<div class="rows"><div class="card"><div class="lbl">Жойылды</div><div class="big">'+PG.kills+'</div></div>'+
    '<div class="card"><div class="lbl">Макс. комбо</div><div class="big">×'+PG.maxStreak+'</div></div></div>'+
    '<button class="cta" id="again">ҚАЙТА ОЙНАУ</button><button class="ghost" id="home">Басты экран</button>');
  $('again').addEventListener('click',startGame);
  $('home').addEventListener('click',screenStart)}

/* ================= power-ups ================= */
function usePower(p){
  if(p==='edit'){screenEdit();return}
  if(p==='quit'){
    PG.paused=false;PG.on=false;PG.over=false;PG.cur=null;PG.locked=false;PG.shield=false;
    $('sheet').classList.remove('show');
    for(var i=W.planes.length-1;i>=0;i--)removePlane(W.planes[i]);
    screenStart();return}
  if(PG.paused)return;
  if(!PG.cur){toast('Алдымен ұшақты түртіп сұрағын аш');return}
  if(p==='fifty'){
    if(PG.fifty<=0)return;
    var a=PG.cur.q.a,wr=shuffle([0,1,2,3].filter(function(i){return i!==a})).slice(0,2);
    Array.prototype.forEach.call($('opts').children,function(b){
      if(wr.indexOf(+b.dataset.i)>-1){b.classList.add('dim');b.style.pointerEvents='none'}});
    PG.fifty--;sfx.power();hud();toast('50/50 қолданылды')}
  if(p==='shield'){
    if(PG.shields<=0)return;
    PG.shield=true;PG.shields=0;sfx.power();hud();toast('Қалқан: келесі қате — өмір кетпейді')}}

/* ================= loop ================= */
function animate(){
  requestAnimationFrame(animate);
  var now=performance.now(),dt=Math.min(.05,(now-T)/1000);T=now;
  if(PG.paused){W.r.render(W.scene,W.cam);return}
  W.t+=dt;
  if(PG.on&&!PG.over){
    if(now>PG.nextAt&&W.planes.length<(PG.wave<3?2:(PG.wave<7?3:4)))spawn();
    tickSheet(now)}
  else if(PG.decor&&W.planes.length<2&&now>PG.nextAt){
    PG.serial++;addPlane(CRAFTS[PG.serial%4],{c:'Демалыс',q:'',o:['','','',''],a:0});
    PG.nextAt=now+2600}
  updatePlanes(dt,W.t);updateFX(dt);updateWorld(dt,W.t);updateCam(dt,W.t);
  W.r.render(W.scene,W.cam)}

function initBar(){
  $('bar').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    usePower(b.dataset.p)});
  hud()}

/* ================= boot ================= */
function boot(){
  if(!hasGL()||!window.THREE){window.__fail();return}
  initWorld();initLabels();initPick();initBar();
  PG.best=+(store('za_best3d')||0);
  $('spin').classList.add('gone');
  screenStart();animate();
  addEventListener('pointerdown',function(){ac()},{once:true})}
function waitThree(n){
  if(window.THREE)return boot();
  if(n<=0)return window.__fail();
  setTimeout(function(){waitThree(n-1)},120)}
if(document.readyState==='loading')addEventListener('DOMContentLoaded',function(){waitThree(60)});
else waitThree(60);
})();
</script>
